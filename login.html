<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Libraryreeds | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-surface: #11141c;
      --bg-surface-elevated: #161b26;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(197, 168, 128, 0.4);
      --text-primary: #f0f2f5;
      --text-secondary: #9ba1b0;
      --text-muted: #9ba1b0;
      --accent-gold: #c5a880;
      --accent-gold-hover: #d8be9b;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-smooth: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); min-height: 100vh; display: flex; flex-direction: column; }

    .top-nav {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(10, 12, 16, 0.94);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 14px 32px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .brand-group { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .brand-logo-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-gold); }
    .brand-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; color: var(--text-primary); letter-spacing: 0.06em; text-transform: uppercase; }
    
    .nav-actions { display: flex; align-items: center; gap: 24px; }
    .nav-link { color: var(--text-secondary); text-decoration: none; font-size: 0.775rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; transition: var(--transition-smooth); }
    .nav-link:hover, .nav-link.active { color: var(--accent-gold); }

    .login-main {
      max-width: 480px;
      margin: 80px auto;
      padding: 0 32px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .login-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: 0.725rem; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary); text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px 16px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 2px; color: var(--text-primary); font-size: 0.85rem; outline: none; font-family: var(--font-sans); }
    .form-input:focus { border-color: var(--border-focus); }

    .btn-primary {
      background: var(--accent-gold);
      color: var(--bg-base);
      border: none;
      padding: 12px 24px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 2px;
      cursor: pointer;
      width: 100%;
      transition: var(--transition-smooth);
    }
    .btn-primary:hover { background: var(--accent-gold-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    [hidden] { display: none !important; }
    .error-msg {
      color: #ff6b6b;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.4;
    }

    footer { border-top: 1px solid var(--border-subtle); background: var(--bg-surface); padding: 48px 32px 32px; margin-top: auto; }
    .footer-bottom { max-width: 1400px; margin: 24px auto 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
    .helper-text { color: var(--text-secondary); font-size: .8rem; line-height: 1.6; }
    .login-card > .helper-text { text-align: center; }
    .text-button { background: none; border: 0; padding: 8px 0; color: var(--accent-gold); font: inherit; font-size: .8rem; cursor: pointer; text-align: left; }
    .remember-label { display: flex; align-items: center; gap: 10px; font-size: .8rem; line-height: 1.6; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-gold); flex-shrink: 0; }
    .btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-focus); }
    .btn-secondary:hover { background: var(--bg-surface-elevated); }
    .divider { text-align: center; color: var(--text-secondary); font-size: .8rem; }
    :focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 4px; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    @media (max-width: 600px) {
      .nav-container { padding: 16px; flex-wrap: wrap; gap: 18px; }
      .nav-actions { gap: 20px; flex-wrap: wrap; }
      .login-main { margin: 40px auto; padding: 0 16px; }
      .login-card { padding: 28px 22px; }
      .form-input { font-size: 16px; }
      footer { padding: 24px 16px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <nav class="top-nav" aria-label="Main navigation">
    <div class="nav-container">
      <a href="./index.html" class="brand-group">
        <img src="https://www.image2url.com/r2/default/images/1787276940228-3d152a55-4616-4ab8-a015-5ae596457a4c.png" alt="" referrerpolicy="no-referrer" class="brand-logo-img">
        <span class="brand-title">Libraryreeds</span>
      </a>
      <div class="nav-actions">
        <a href="./shop.html" class="nav-link">Shop</a>
      </div>
    </div>
  </nav>

  <main class="login-main">
    <div class="login-card">
      <h1 id="authTitle" class="login-title">Sign In</h1>
      <p id="authDescription" class="helper-text">Access your Libraryreeds account.</p>
      <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address:</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password:</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" name="password" required autocomplete="current-password">
        </div>
        <div id="confirmPasswordGroup" class="form-group" hidden>
          <label class="form-label" for="confirmPassword">Confirm Password:</label>
          <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" autocomplete="new-password" disabled>
          <p class="helper-text">Use at least 12 characters. Your password must also meet the account’s password requirements.</p>
        </div>
        <button type="button" id="showPassword" class="text-button" aria-controls="loginPassword confirmPassword" aria-pressed="false">Show password</button>
        <label class="remember-label"><input type="checkbox" id="rememberMe"> Keep me signed in on this device</label>
        <p class="helper-text">Leave unchecked on shared devices.</p>
        <div id="loginError" class="error-msg" role="alert" tabindex="-1" hidden></div>
        <p id="loginStatus" class="helper-text" role="status" aria-live="polite">Loading sign-in…</p>
        <button type="submit" id="submitBtn" disabled class="btn-primary" style="margin-top: 8px;">Sign In to Account</button>
        <button type="button" id="resetPassword" class="text-button" disabled>Forgot password?</button>
      </form>
      <p id="accountPrompt" class="helper-text">New to Libraryreeds?</p>
      <button type="button" id="toggleSignup" class="btn-primary btn-secondary" aria-controls="loginForm" disabled>Create an account</button>
      <div class="divider" aria-hidden="true">or</div>
      <button type="button" id="googleSignIn" class="btn-primary btn-secondary" disabled>Continue with Google</button>
      <noscript><p class="helper-text">Enable JavaScript to sign in.</p></noscript>
    </div>
  </main>

  <footer>
    <div class="footer-bottom"><span>&copy; 2026 Libraryreeds. All rights reserved.</span></div>
  </footer>
  <script>
    // Keep navigation usable even if the authentication SDK cannot load.
    window.loginLoadTimer = setTimeout(() => {
      document.getElementById('loginStatus').textContent = 'Sign-in could not load. Check your connection and reload this page.';
    }, 15000);
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail,
      setPersistence, browserSessionPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqh6sJzEA5Mkg27tkXDgRTvog_QJ_zUtg",
      authDomain: "libraryreeds-638f4.firebaseapp.com",
      projectId: "libraryreeds-638f4",
      storageBucket: "libraryreeds-638f4.firebasestorage.app",
      messagingSenderId: "768304310517",
      appId: "1:768304310517:web:39b931e6447043d84d3dbc"
    };

    const $ = (id) => document.getElementById(id);
    const form = $('loginForm');
    const errorBox = $('loginError');
    const status = $('loginStatus');
    const controls = [...form.querySelectorAll('input, button'), $('googleSignIn'), $('toggleSignup')];
    let signup = false;
    let ready = false;
    let busy = false;
    let leaving = false;
    let auth;
    let unsubscribe;

    function setBusy(value) {
      busy = value;
      controls.forEach(control => { control.disabled = value || !ready; });
      $('confirmPassword').disabled = value || !ready || !signup;
      form.setAttribute('aria-busy', String(value));
      $('submitBtn').textContent = value ? 'Please wait…' : (signup ? 'Create Account' : 'Sign In to Account');
    }
    function clearMessages() {
      errorBox.hidden = true;
      errorBox.textContent = '';
      status.textContent = '';
    }
    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
      errorBox.focus();
    }
    function handleError(error) {
      // Never render provider error messages, credentials, tokens, or account existence.
      const code = error?.code;
      const messages = {
        'auth/weak-password': 'Choose a stronger password that meets the account’s password requirements.',
        'auth/password-does-not-meet-requirements': 'Choose a stronger password that meets the account’s password requirements.',
        'auth/network-request-failed': 'Check your connection and try again.',
        'auth/too-many-requests': 'Too many attempts. Please wait before trying again.',
        'auth/popup-blocked': 'Allow pop-ups for this site, then try Google sign-in again.',
        'auth/popup-closed-by-user': 'Google sign-in was closed. You can try again.',
        'auth/cancelled-popup-request': 'Please complete one sign-in attempt at a time.',
        'auth/operation-not-allowed': 'This sign-in method is unavailable. Try another method.',
        'auth/unauthorized-domain': 'Sign-in is unavailable on this address. Please use www.libraryreeds.org.',
        'auth/account-exists-with-different-credential': 'Try the sign-in method you originally used.',
        'auth/multi-factor-auth-required': 'This account requires additional verification. Use your existing verification-enabled sign-in page.'
      };
      showError(messages[code] || (signup
        ? 'Unable to create an account with these details. Check your entries, or try signing in or resetting your password.'
        : 'Unable to sign in. Check your email and password, or try your original sign-in method.'));
    }
    function goToAccount() {
      if (leaving) return;
      leaving = true;
      $('loginPassword').value = '';
      $('confirmPassword').value = '';
      // Fixed local destination; URL parameters cannot redirect to an outside site.
      // Authorization belongs in account.html AND Firebase rules/backend checks.
      window.location.replace('./account.html');
    }
    async function persistence() {
      await setPersistence(auth, $('rememberMe').checked
        ? browserLocalPersistence : browserSessionPersistence);
    }

    $('showPassword').addEventListener('click', () => {
      const show = $('loginPassword').type === 'password';
      $('loginPassword').type = show ? 'text' : 'password';
      $('confirmPassword').type = show ? 'text' : 'password';
      $('showPassword').textContent = show ? 'Hide password' : 'Show password';
      $('showPassword').setAttribute('aria-pressed', String(show));
    });
    $('toggleSignup').addEventListener('click', () => {
      if (!ready || busy || leaving) return;
      signup = !signup;
      clearMessages();
      $('authTitle').textContent = signup ? 'Create an Account' : 'Sign In';
      document.title = signup ? 'Libraryreeds | Create an Account' : 'Libraryreeds | Sign In';
      $('authDescription').textContent = signup ? 'Join Libraryreeds with your email and password.' : 'Access your Libraryreeds account.';
      $('accountPrompt').textContent = signup ? 'Already have an account?' : 'New to Libraryreeds?';
      $('toggleSignup').textContent = signup ? 'Back to sign in' : 'Create an account';
      $('confirmPasswordGroup').hidden = !signup;
      $('confirmPassword').required = signup;
      $('loginPassword').minLength = signup ? 12 : 0;
      $('loginPassword').autocomplete = signup ? 'new-password' : 'current-password';
      $('loginPassword').value = '';
      $('confirmPassword').value = '';
      $('loginPassword').type = 'password';
      $('confirmPassword').type = 'password';
      $('showPassword').textContent = 'Show password';
      $('showPassword').setAttribute('aria-pressed', 'false');
      $('resetPassword').hidden = signup;
      setBusy(false);
      $('loginEmail').focus();
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!ready || busy || leaving || !form.reportValidity()) return;
      clearMessages();
      if (signup && $('loginPassword').value.length < 12) {
        showError('Use a password with at least 12 characters.');
        return;
      }
      if (signup && $('loginPassword').value !== $('confirmPassword').value) {
        showError('Your passwords do not match. Please enter them again.');
        return;
      }
      setBusy(true);
      try {
        await persistence();
        if (signup) {
          // Firebase creates an ordinary auth account. Never assign roles, claims,
          // admin flags, or write authorization documents from this public page.
          await createUserWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value);
        } else {
          await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value);
        }
        goToAccount();
      } catch (error) {
        $('loginPassword').value = '';
      $('confirmPassword').value = '';
        handleError(error);
      } finally {
        if (!leaving) setBusy(false);
      }
    });
    $('googleSignIn').addEventListener('click', async () => {
      if (!ready || busy || leaving) return;
      clearMessages();
      setBusy(true);
      try {
        await persistence();
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await signInWithPopup(auth, provider);
        goToAccount();
      } catch (error) {
        handleError(error);
      } finally {
        if (!leaving) setBusy(false);
      }
    });
    $('resetPassword').addEventListener('click', async () => {
      if (!ready || busy || leaving) return;
      clearMessages();
      const email = $('loginEmail');
      email.value = email.value.trim();
      if (!email.reportValidity()) return;
      setBusy(true);
      try {
        await sendPasswordResetEmail(auth, email.value);
        status.textContent = 'If this email has a password account, you’ll receive a reset link. Check your inbox and spam folder. For Google accounts, use Continue with Google.';
      } catch (error) {
        if (['auth/user-not-found', 'auth/invalid-email'].includes(error?.code)) {
          status.textContent = 'If this email has a password account, you’ll receive a reset link. Check your inbox and spam folder. For Google accounts, use Continue with Google.';
        } else {
          handleError(error);
        }
      } finally {
        setBusy(false);
      }
    });
    try {
      auth = getAuth(initializeApp(firebaseConfig));
      unsubscribe = onAuthStateChanged(auth, user => {
        clearTimeout(window.loginLoadTimer);
        if (user) { if (!busy) goToAccount(); return; }
        ready = true;
        status.textContent = '';
        setBusy(false);
      }, () => {
        clearTimeout(window.loginLoadTimer);
        ready = false;
        setBusy(false);
        showError('Sign-in could not load. Please reload the page.');
      });
    } catch {
      clearTimeout(window.loginLoadTimer);
      ready = false;
      setBusy(false);
      showError('Sign-in could not load. Please reload the page.');
    }
    window.addEventListener('pagehide', () => {
      clearTimeout(window.loginLoadTimer);
      $('loginPassword').value = '';
      $('confirmPassword').value = '';
      if (unsubscribe) unsubscribe();
    });
    // Reinitialize auth if the browser restores this page from its back/forward cache.
    window.addEventListener('pageshow', event => {
      if (event.persisted) window.location.reload();
    });
  </script>
</body>
</html>
