<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Reeds Coupon Admin</title><style>body{background:#0a0c10;color:#eee;font:16px system-ui;max-width:720px;padding:30px;margin:auto}section{padding:25px;background:#161b26;margin:18px 0;border-radius:10px}input,button{font:inherit;padding:10px;margin:6px 0;display:block;width:95%}button{background:#c5a880;border:0;cursor:pointer}</style><a href="account.html" style="color:#c5a880">← Admin Settings</a><h1>Coupon Administration</h1><p id="authStatus">Checking login…</p><section><h2>Create sale offer</h2><form id="offer"><label>Offer title<input name="title" required value="20% off Library Reeds books"></label><label>Discount percentage<input name="percentOff" type="number" min="1" max="100" value="20" required></label><label>Selling price in dollars<input name="dollars" type="number" step="0.01" min="0" value="2.00" required></label><label>Expiration date (optional)<input name="expiresAt" type="date"></label><button>Create coupon offer</button></form><p id="offerResult"></p></section><section><h2>Issue coupon for verified paid order</h2><p>This succeeds only when the trusted backend has marked the order <code>paymentVerified: true</code> and <code>paid: true</code>, with <code>buyerUid</code> and <code>couponOfferId</code>.</p><form id="issue"><label>Paid order's Firestore document ID<input name="orderId" required></label><button>Issue paid coupon</button></form><p id="issueResult"></p></section><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';
const cfg={apiKey:'AIzaSyBqh6sJzEA5Mkg27tkXDgRTvog_QJ_zUtg',authDomain:'libraryreeds-638f4.firebaseapp.com',projectId:'libraryreeds-638f4',storageBucket:'libraryreeds-638f4.firebasestorage.app',messagingSenderId:'768304310517',appId:'1:768304310517:web:39b931e6447043d84d3dbc'};const app=getApps().length?getApp():initializeApp(cfg);const auth=getAuth(app),fn=getFunctions(app,'us-central1');onAuthStateChanged(auth,u=>document.getElementById('authStatus').textContent=u?'Signed in. Only your configured admin UID is permitted to save.':'Sign in via account.html first.');
document.getElementById('offer').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await httpsCallable(fn,'lrSaveCouponOffer')({title:f.get('title'),percentOff:Number(f.get('percentOff')),priceCents:Math.round(Number(f.get('dollars'))*100),expiresAt:f.get('expiresAt')||null});document.getElementById('offerResult').textContent='Offer created: '+r.data.offerId;}catch(e){document.getElementById('offerResult').textContent=e.message;}};document.getElementById('issue').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let r=await httpsCallable(fn,'lrIssuePaidCoupon')({orderId:f.get('orderId')});document.getElementById('issueResult').textContent='Coupon ID: '+r.data.couponId;}catch(e){document.getElementById('issueResult').textContent=e.message;}};
</script></html>
